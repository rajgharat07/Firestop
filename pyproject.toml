[project]
name = "firestop"
version = "0.1.0"
description = "Blast radius and chokepoint analysis for software supply chain compromises, on HydraDB"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[project.scripts]
firestop = "firestop.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["firestop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer and FastAPI both declare parameters as call expressions in argument
# defaults; that is the frameworks' interface, not an accident.
"firestop/cli.py" = ["B008"]
"firestop/api/app.py" = ["B008"]
